# Sammelt rund um die Uhr Ranked-Games: stündlich angestoßen, die Läufe warten aufeinander
# (concurrency), sodass immer genau einer läuft – ein Lauf dauert ~5,5 Std., dann startet sofort der nächste.
# und veröffentlicht die Datenbank als Release "meta-latest" für die Jungle-Coach-App.
name: Crawl meta
on:
  workflow_dispatch:
    inputs:
      minutes: { description: "Laufzeit in Minuten", default: "320" }
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  id-token: write   # proves to moosi.app that this is the crawl workflow -> gets the current Riot key from the app
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Load previous database
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download meta-latest -p meta.sqlite.gz -R ${{ github.repository }} && gunzip -f meta.sqlite.gz || echo "first run"
      - name: Riot key from moosi.app (the admin sets it once in the app)
        run: |
          OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=moosi.app" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          KEY=$(curl -sf -X POST -H "Authorization: Bearer $OIDC" https://moosi.app/api/crawler/key | python -c "import sys,json;print(json.load(sys.stdin).get('key',''))" || true)
          if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; echo "SERVER_RIOT_KEY=$KEY" >> "$GITHUB_ENV"; echo "Key vom Server geholt"; else echo "kein Server-Key – nutze Secret"; fi
      - name: Crawl
        env: { RIOT_API_KEY: "${{ secrets.RIOT_API_KEY }}" }
        run: python crawl.py --minutes ${{ inputs.minutes || '320' }}
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view meta-latest -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create meta-latest -R ${{ github.repository }} --title "Meta-Datenbank" --notes "Wird automatisch aktualisiert."
          gh release upload meta-latest meta.sqlite.gz --clobber -R ${{ github.repository }}
