# Holt bei jedem Lauf die aktuellen Spieldaten (Champion-Kits, Items, Camps) und veröffentlicht sie als Release "gamedata-latest".
name: Game data
on:
  workflow_dispatch:
  push:
    paths: ["fetch_gamedata.py", "build_sim.py", "jc/sim/**", ".github/workflows/gamedata.yml"]
  schedule:
    - cron: "41 3 * * *"
permissions:
  contents: write
jobs:
  gamedata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_gamedata.py
      - name: Build simulation data
        run: if [ -f build_sim.py ]; then python build_sim.py gamedata sim.json.gz; fi
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view gamedata-latest -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create gamedata-latest -R ${{ github.repository }} --title "Spieldaten" --notes "Champion-Kits, Items und Jungle-Camps des aktuellen Patches. Wird automatisch aktualisiert."
          gh release upload gamedata-latest gamedata-raw.tar.gz --clobber -R ${{ github.repository }}
          if [ -f sim.json.gz ]; then gh release upload gamedata-latest sim.json.gz --clobber -R ${{ github.repository }}; fi
